<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui">
  <h:head>
    <title>Vendas | Catálogo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet library="vendas" name="style.css"/>
  </h:head>
  <h:body>
    <header>
      <strong>Vendas<span> / Catálogo</span></strong>
      <nav>
        <h:link outcome="index" value="Início"/>
        <h:link outcome="marcas" value="Marcas"/>
        <h:link outcome="categorias" value="Categorias"/>
        <h:link outcome="produtos" value="Produtos"/>
      </nav>
    </header>
    <main>
      <ui:insert name="conteudo"/>
    </main>
      <h:form>
        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
          <p:commandButton value="Cancelar" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/>
          <p:commandButton value="Excluir" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/>
        </p:confirmDialog>
      </h:form>
    <footer>Programação WEB 2 · ADS · Módulo de catálogo</footer>
  </h:body>
</html>
