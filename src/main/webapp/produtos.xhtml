<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui" template="template.xhtml"><ui:define name="conteudo"><h1>Produtos</h1><p class="intro">Cadastre, pesquise e atualize os registros do catálogo.</p><h:form id="form" enctype="multipart/form-data"><p:growl id="growl" showDetail="true"/><div class="layout"><h:panelGroup id="editor" layout="block" styleClass="panel"><h2>#{empty produtoController.atual.id ? 'Novo registro' : 'Editar registro'}</h2><div class="field"><label>Nome</label><p:inputText value="#{produtoController.atual.nome}" required="true" requiredMessage="Informe o nome." maxlength="160"/></div><div class="field"><label>Descrição</label><p:inputTextarea value="#{produtoController.atual.descricao}" rows="3" autoResize="false"/></div><div class="field"><label>Preço (R$)</label><p:inputNumber value="#{produtoController.atual.preco}" decimalPlaces="2" decimalSeparator="," thousandSeparator="." minValue="0.01" required="true"/></div><div class="field"><label>Quantidade em estoque</label><p:inputNumber value="#{produtoController.atual.quantidadeEstoque}" decimalPlaces="0" minValue="0" required="true"/></div><div class="field"><label>Marca</label><p:selectOneMenu value="#{produtoController.atual.marca}" converter="marcaConverter" required="true" style="width:100%"><f:selectItem itemLabel="Selecione" itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{produtoController.marcas}" var="op" itemLabel="#{op.nome}" itemValue="#{op}"/></p:selectOneMenu></div><div class="field"><label>Categoria</label><p:selectOneMenu value="#{produtoController.atual.categoria}" converter="categoriaConverter" required="true" style="width:100%"><f:selectItem itemLabel="Selecione" itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{produtoController.categorias}" var="op" itemLabel="#{op.caminho}" itemValue="#{op}"/></p:selectOneMenu></div><div class="field"><label>Imagem · JPG, PNG ou WEBP · até 5 MB</label><p:fileUpload mode="advanced" auto="true" multiple="false" listener="#{produtoController.upload}" update="preview growl" process="@this" label="Escolher imagem"/><h:panelGroup id="preview"><p:graphicImage url="#{request.contextPath}/imagens/#{produtoController.preview}" rendered="#{not empty produtoController.preview}" styleClass="preview"/></h:panelGroup></div><div class="actions"><p:commandButton value="Salvar" icon="pi pi-check" action="#{produtoController.salvar}" process="editor @this" update="@form"/><p:commandButton value="Cancelar" action="#{produtoController.cancelar}" process="@this" update="@form" resetValues="true" styleClass="ui-button-secondary"/></div></h:panelGroup><section class="panel"><p:commandButton value="Atualizar lista" action="#{produtoController.recarregar}" process="@this" update="tabela growl"/><p:dataTable id="tabela" value="#{produtoController.lista}" var="item" rowKey="#{item.id}" paginator="true" rows="8" rowsPerPageTemplate="8,16,32" paginatorPosition="bottom" emptyMessage="Nenhum registro encontrado." reflow="true"><p:column headerText="Imagem"><p:graphicImage url="#{request.contextPath}/imagens/#{item.caminhoImagem}" rendered="#{not empty item.caminhoImagem}" styleClass="thumb"/><h:outputText value="Sem imagem" rendered="#{empty item.caminhoImagem}"/></p:column><p:column headerText="Nome" sortBy="#{item.nome}" filterBy="#{item.nome}" filterMatchMode="contains"><h:outputText value="#{item.nome}"/></p:column><p:column headerText="Preço" sortBy="#{item.preco}"><h:outputText value="#{item.preco}"><f:convertNumber type="currency" currencySymbol="R$" locale="pt_BR"/></h:outputText></p:column><p:column headerText="Estoque" sortBy="#{item.quantidadeEstoque}"><h:outputText value="#{item.quantidadeEstoque}"/></p:column><p:column headerText="Marca" filterBy="#{item.marca.nome}" filterMatchMode="contains"><h:outputText value="#{item.marca.nome}"/></p:column><p:column headerText="Categoria" filterBy="#{item.categoria.caminho}" filterMatchMode="contains"><h:outputText value="#{item.categoria.caminho}"/></p:column><p:column headerText="Ações"><p:commandButton icon="pi pi-pencil" title="Editar" action="#{produtoController.editar(item)}" process="@this" update="editor" resetValues="true"/><p:commandButton icon="pi pi-trash" title="Excluir" action="#{produtoController.excluir(item)}" process="@this" update="@form" styleClass="ui-button-danger"><p:confirm header="Confirmar exclusão" message="Excluir este registro?" icon="pi pi-exclamation-triangle"/></p:commandButton></p:column></p:dataTable></section></div></h:form></ui:define></ui:composition>
