<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui" template="template.xhtml">
  <ui:define name="conteudo">
    <h1>Marcas</h1>
    <p class="intro">Cadastre, pesquise e atualize os registros do catálogo.</p>
    <h:form id="form" enctype="multipart/form-data">
      <p:growl id="growl" showDetail="true"/>
      <div class="layout">
        <h:panelGroup id="editor" layout="block" styleClass="panel">
          <h2>#{empty marcaController.atual.id ? 'Novo registro' : 'Editar registro'}</h2>
          <div class="field">
            <label>Nome</label>
            <p:inputText value="#{marcaController.atual.nome}" required="true" requiredMessage="Informe o nome." maxlength="120"/>
          </div>
          <div class="field">
            <label>Descrição</label>
            <p:inputTextarea value="#{marcaController.atual.descricao}" rows="3" autoResize="false"/>
          </div>
          <div class="field">
            <label>Ativa</label>
            <p:selectBooleanCheckbox value="#{marcaController.atual.ativo}"/>
          </div>
          <div class="actions">
            <p:commandButton value="Salvar" icon="pi pi-check" action="#{marcaController.salvar}" process="editor @this" update="@form"/>
            <p:commandButton value="Cancelar" action="#{marcaController.cancelar}" process="@this" update="@form" resetValues="true" styleClass="ui-button-secondary"/>
          </div>
        </h:panelGroup>
        <section class="panel">
          <p:commandButton value="Atualizar lista" action="#{marcaController.recarregar}" process="@this" update="tabela growl"/>
          <p:dataTable id="tabela" value="#{marcaController.lista}" var="item" rowKey="#{item.id}" paginator="true" rows="8" rowsPerPageTemplate="8,16,32" paginatorPosition="bottom" emptyMessage="Nenhum registro encontrado." reflow="true">
            <p:column headerText="Nome" sortBy="#{item.nome}" filterBy="#{item.nome}" filterMatchMode="contains">
              <h:outputText value="#{item.nome}"/>
            </p:column>
            <p:column headerText="Ativa">
              <h:outputText value="#{item.ativo ? 'Sim' : 'Não'}"/>
            </p:column>
            <p:column headerText="Ações">
              <p:commandButton icon="pi pi-pencil" title="Editar" action="#{marcaController.editar(item)}" process="@this" update=":form:editor" resetValues="true"/>
              <p:commandButton icon="pi pi-trash" title="Excluir" action="#{marcaController.excluir(item)}" process="@this" update="@form" styleClass="ui-button-danger">
                <p:confirm header="Confirmar exclusão" message="Excluir este registro?" icon="pi pi-exclamation-triangle"/>
              </p:commandButton>
            </p:column>
          </p:dataTable>
        </section>
      </div>
    </h:form>
  </ui:define>
</ui:composition>
