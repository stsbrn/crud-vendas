<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui" template="template.xhtml"><ui:define name="conteudo"><h1>Categorias</h1><p class="intro">Cadastre, pesquise e atualize os registros do catálogo.</p><h:form id="form" enctype="multipart/form-data"><p:growl id="growl" showDetail="true"/><div class="layout"><h:panelGroup id="editor" layout="block" styleClass="panel"><h2>#{empty categoriaController.atual.id ? 'Novo registro' : 'Editar registro'}</h2><div class="field"><label>Nome</label><p:inputText value="#{categoriaController.atual.nome}" required="true" requiredMessage="Informe o nome." maxlength="120"/></div><div class="field"><label>Categoria pai (opcional)</label><p:selectOneMenu value="#{categoriaController.atual.categoriaPai}" converter="categoriaConverter" style="width:100%"><f:selectItem itemLabel="Categoria raiz" itemValue="#{null}" noSelectionOption="true"/><f:selectItems value="#{categoriaController.lista}" var="c" itemLabel="#{c.caminho}" itemValue="#{c}"/></p:selectOneMenu></div><div class="actions"><p:commandButton value="Salvar" icon="pi pi-check" action="#{categoriaController.salvar}" process="editor @this" update="@form"/><p:commandButton value="Cancelar" action="#{categoriaController.cancelar}" process="@this" update="@form" resetValues="true" styleClass="ui-button-secondary"/></div></h:panelGroup><section class="panel"><p:commandButton value="Atualizar lista" action="#{categoriaController.recarregar}" process="@this" update="tabela growl"/><p:dataTable id="tabela" value="#{categoriaController.lista}" var="item" rowKey="#{item.id}" paginator="true" rows="8" rowsPerPageTemplate="8,16,32" paginatorPosition="bottom" emptyMessage="Nenhum registro encontrado." reflow="true"><p:column headerText="Nome" sortBy="#{item.nome}" filterBy="#{item.nome}" filterMatchMode="contains"><h:outputText value="#{item.nome}"/></p:column><p:column headerText="Caminho" sortBy="#{item.caminho}" filterBy="#{item.caminho}" filterMatchMode="contains"><h:outputText value="#{item.caminho}"/></p:column><p:column headerText="Ações"><p:commandButton icon="pi pi-pencil" title="Editar" action="#{categoriaController.editar(item)}" process="@this" update="editor" resetValues="true"/><p:commandButton icon="pi pi-trash" title="Excluir" action="#{categoriaController.excluir(item)}" process="@this" update="@form" styleClass="ui-button-danger"><p:confirm header="Confirmar exclusão" message="Excluir este registro?" icon="pi pi-exclamation-triangle"/></p:commandButton></p:column></p:dataTable></section></div></h:form></ui:define></ui:composition>
